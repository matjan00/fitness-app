name: Garmin send workout

on:
  workflow_dispatch:
    inputs:
      session_id:
        description: "Plan session id (the steps come from the app's request record)"
        required: true
        type: string

# Sync and send never log in to Garmin at the same time.
concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install garminconnect==0.3.16

      - name: Run unit tests (no network)
        run: |
          python scripts/test_garmin_workouts.py
          python scripts/test_garmin_send.py

      - name: Send workout to Garmin
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
          SESSION_ID: ${{ inputs.session_id }}
        run: python scripts/garmin_send.py
