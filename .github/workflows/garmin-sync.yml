name: Garmin sync

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
    inputs:
      replace_typed_sleep:
        description: "Replace sleep you typed in by hand with Garmin's (last 7 days)"
        type: boolean
        default: false

# Sync and send never log in to Garmin at the same time.
concurrency:
  group: garmin
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install garminconnect==0.3.16

      - name: Run unit tests (no network)
        run: python scripts/test_garmin_sync.py -v

      - name: Sync Garmin runs and sleep
        env:
          REPLACE_TYPED_SLEEP: ${{ inputs.replace_typed_sleep }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_USER_ID: ${{ secrets.SUPABASE_USER_ID }}
        run: python scripts/garmin_sync.py
